# asia の利用者は asia1 にしか来ない（ルーターが国で振り分ける）。asia1 の 2 コアが足りないので、同じリージョンの asia2（往復 0.4ms）でもアプリを動かして振り分ける。
# 接続元（X-Client-IP、ベンチは利用者ごとに違う値を付ける）で台を固定する。isureal-guard は台ごとのジャーナルで失敗を数えて BAN するので、同じ接続元を 1 台に集めないと BAN が遅れる。
# weight は asia2 の DB の CPU の空きに合わせて変える
upstream isureal_app {
  hash $http_x_client_ip consistent;
  server 127.0.0.1:8080 weight=2 max_fails=3 fail_timeout=5s;
  server 192.168.4.10:8080 weight=1 max_fails=3 fail_timeout=5s;
  keepalive 128;
}

upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;

  location /api/ {
    proxy_pass http://isureal_app;
  }

  # 投稿の画像は受けた台のディスクに fsync して置く。asia2 では DB と同じディスクを取り合うので asia1 で受ける
  location = /api/posts {
    proxy_pass http://isureal_local;
  }

  # 初期データの投稿の画像は asia1 のディスクにだけ書き出してある（initial_image_store.go）
  location = /api/me/export {
    proxy_pass http://isureal_local;
  }

  location = /api/initialize {
    proxy_pass http://isureal_local;
  }

  location / {
    try_files $uri /index.html;
  }
}
