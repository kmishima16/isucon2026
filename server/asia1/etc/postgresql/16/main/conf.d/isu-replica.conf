# asia2 の同期の読み取り用の複製（hot standby）。asia1 のアプリの読みだけを受ける（ISUREAL_DB_READ_HOST）。
# 複製は主（asia2）以上の max_connections が要る
max_connections = 200
# asia1 はアプリと nginx も動かすので、メモリは控えめにする（3.7GB のうち空きは約 1.5GB）
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 16MB
random_page_cost = 1.1
hot_standby = on
# 主の VACUUM が複製の読みを取り消さないようにする
hot_standby_feedback = on
# 主のコミットは複製の反映を待つので、反映が読みに長く待たされないようにする（過ぎたら重なった読みを取り消す）
max_standby_streaming_delay = 500ms
