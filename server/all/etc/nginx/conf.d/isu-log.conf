# alp と pprotein 用の LTSV ログ。元の access.log はそのまま残し、別ファイルに追加で書く（既存設定を壊さない）。
# pprotein は alp を ltsv で呼ぶ決め打ちなので、JSON ではなく LTSV にしている。ラベル名は alp の既定に合わせる。
# 注意：server ブロック側に access_log があると、そちらが優先されてここは書かれない。
# 最終盤に「計測を外す」ときは、このファイルを消して commit → make deploy。
log_format isu_ltsv "time:$time_iso8601\tmethod:$request_method\turi:$request_uri"
                    "\tstatus:$status\tsize:$body_bytes_sent"
                    "\treqtime:$request_time\tapptime:$upstream_response_time";
access_log /var/log/nginx/access.ltsv isu_ltsv;
