# alp 用の JSON ログ。元の access.log はそのまま残し、別ファイルに追加で書く（既存設定を壊さない）。
# 注意：server ブロック側に access_log があると、そちらが優先されてここは書かれない。
# 最終盤に「計測を外す」ときは、このファイルを消して commit → make deploy。
log_format isu_json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
                                '"status":"$status","body_bytes":"$body_bytes_sent",'
                                '"response_time":"$request_time","upstream_time":"$upstream_response_time"}';
access_log /var/log/nginx/access.json isu_json;
