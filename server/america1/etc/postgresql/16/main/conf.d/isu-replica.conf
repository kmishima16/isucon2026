# この台の PostgreSQL は asia2 の複製（hot standby）。america の読み取りを、往復 100ms の asia2 に行かずに台の中で済ませる（webapp/go/replica.go）。
# 最初の写しは pg_basebackup -R で取る（primary_conninfo と standby.signal はそのときに書かれる）
hot_standby = on
# 主の掃除が、複製で読んでいる行を消して読み取りを取り消させないようにする
hot_standby_feedback = on
# 初期化の TRUNCATE などで適用が止まり続けないよう、ぶつかった読み取りは 1 秒で取り消す（取り消された読み取りは主の DB に回る）
max_standby_streaming_delay = 1s
# hot standby は、主（asia2）の max_connections 以上でないと立ち上がらない
max_connections = 200
# アプリ（GOMEMLIMIT 1500MiB）と台の 3.8GB に収める
shared_buffers = 512MB
effective_cache_size = 2GB
listen_addresses = 'localhost'
