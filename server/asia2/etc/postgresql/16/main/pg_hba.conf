# asia2 の元の pg_hba.conf（コメントを除く）に、europe1・america1・asia1 の複製の接続を足したもの。
# europe・america の読み取りを台の中の複製で済ませ（webapp/go/replica.go）、asia1 の読みを同期の複製に回すため（isu-replica.conf）
local   all             postgres                                peer
local   all             all                                     peer
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
host    replication     replicator      192.168.2.10/32         scram-sha-256
host    replication     replicator      192.168.3.10/32         scram-sha-256
host isureal isureal 0.0.0.0/0 scram-sha-256
host    replication     isureal         192.168.1.10/32         scram-sha-256
