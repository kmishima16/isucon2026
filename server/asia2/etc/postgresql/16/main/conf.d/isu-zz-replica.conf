# asia1 に置く同期の読み取り用の複製（server/asia1/usr/local/sbin/isu-replica-build で作る）。
# asia2 の 2 コアが全体の天井だったので、asia1 の空いた CPU で読みをこなす。isu-tuning.conf より後に読ませるため、名前を zz にしている。
# 複製が長く落ちたときに、asia2 のディスクを WAL で埋めない
max_slot_wal_keep_size = 4GB
# 有効にするとき：asia1 で isu-replica-build が終わり、pg_stat_replication で追いついたのを確かめてから、次の 2 行の # を外して deploy する。
# コミットは複製が反映するまで待つので、どの台で書いても、直後の asia1 の読みに結果が見える。
# 複製ができる前に有効にすると、すべてのコミットが止まる
#synchronous_standby_names = 'asia1'
#synchronous_commit = remote_apply
