# 計測用。PostgreSQL のクエリは pt-query-digest で集計できないので pg_stat_statements で見る。
# 計測を外すときもこのファイルは消さない。deploy は、リポジトリで消したファイルをサーバーから消さないため。
# make measure-off / measure-on は、末尾の 3 つの値だけを書き換える（3 つとも reload で効き、deploy が reload する）。
# shared_preload_libraries と pg_stat_statements.max は restart が要るので、計測の on / off では変えない（読み込んだままにする）。
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
# パラメータの値（画像の bytea など）はログを膨らませるので書かない。log_line_prefix は isu.env の SLOW_LOG_PREFIX と合わせる。
log_parameter_max_length = 0
log_line_prefix = '%m [%p] '
# ここから下を make measure-off / measure-on が書き換える（計測あり：all・on・0、計測なし：none・off・-1）。
pg_stat_statements.track = all
track_io_timing = on
# クエリごとの回数と時間を pprotein と make analyze（slp pg）で見るため、全クエリを本体のログに書く（isu.env の SLOW_LOG）。
log_min_duration_statement = 0
