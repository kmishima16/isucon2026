# 計測用。PostgreSQL のクエリは pt-query-digest で集計できないので pg_stat_statements で見る。
# shared_preload_libraries の変更は restart が要る（deploy は PostgreSQL を restart しないので手で行う）。
# 最終盤に「計測を外す」ときは、このファイルを消して commit → deploy → restart。
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
track_io_timing = on
