# 計測用。PostgreSQL のクエリは pt-query-digest で集計できないので pg_stat_statements で見る。
# shared_preload_libraries の変更は restart が要る（deploy は PostgreSQL を restart しないので手で行う）。
# 最終盤に「計測を外す」ときは、このファイルを消して commit → deploy → restart。
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
track_io_timing = on
# クエリごとの回数と時間を pprotein と make analyze（slp pg）で見るため、全クエリを本体のログに書く（isu.env の SLOW_LOG）。
# パラメータの値（画像の bytea など）はログを膨らませるので書かない。log_line_prefix は isu.env の SLOW_LOG_PREFIX と合わせる。
# この 3 つは reload で効く（deploy は PostgreSQL を reload しないので手で sudo systemctl reload postgresql）
log_min_duration_statement = 0
log_parameter_max_length = 0
log_line_prefix = '%m [%p] '
