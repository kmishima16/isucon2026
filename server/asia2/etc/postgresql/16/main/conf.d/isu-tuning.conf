# asia2 は DB だけの台（2 コア・3.7GB）。既定の shared_buffers 128MB では、ベンチで触る行がメモリに収まらない。
# 画像（約 14GB）は OS のページキャッシュにも頼るので、shared_buffers は 1GB にとどめる。
# shared_buffers の変更は restart が要る（deploy は PostgreSQL を restart しないので手で行う）。
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
# gp3（SSD）なのでランダム読みを安く見積もる
random_page_cost = 1.1
