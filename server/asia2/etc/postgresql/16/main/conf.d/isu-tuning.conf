# asia2 は DB だけの台（2 コア・3.7GB）。既定の shared_buffers 128MB では、ベンチで触る行がメモリに収まらない。
# 画像（約 14GB）は OS のページキャッシュにも頼るので、shared_buffers は 1GB にとどめる。
# shared_buffers の変更は restart が要る（deploy は PostgreSQL を restart しないので手で行う）。
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
# gp3（SSD）なのでランダム読みを安く見積もる
random_page_cost = 1.1
# 画像の INSERT とコミットのたびの書き込みで、asia2 のディスク待ちがベンチ中 20% を超えていた。コミットの WAL の書き出しを待たない。
# 正常な再起動ではデータは残り、失うのは OS ごと落ちたときの直近の書き込みだけ（人間が AGENTS.md の 3 節によらず入れると決めた）
# asia1 の同期の複製を有効にしたら、isu-zz-replica.conf の remote_apply がこれを上書きする
synchronous_commit = off
# 画像（1 枚平均 363KB）の INSERT で WAL がすぐ 1GB に達し、ベンチの最中に WAL 起因のチェックポイントが続けて走っていた
# （58270 点の回、04:27:19 から 23 秒で約 290MB を書き、終わった直後に次が始まった）。1 回のベンチの WAL では上限に届かないようにする。どちらも reload で効く
max_wal_size = 8GB
checkpoint_timeout = 15min
# DB まで往復 100ms の europe1・america1 は、接続 1 本が 1 回の問い合わせで 100ms ふさがる。15 本では 1 台が約 80 件/秒で頭打ちになり、
# 3 日目に入った新しい人が期間内に投稿しきれず、欧米の人数が止まっていた。欧米の本数を増やせるよう上限を上げる。restart が要る
max_connections = 200
# europe1・america1 の複製は、書き出した WAL しか受け取れない。synchronous_commit=off では書き出しが最大 200ms 遅れ、
# 複製で読む前の待ち（replica.go の関所）が延びるので、10ms ごとに書き出す。どちらも reload で効く
wal_writer_delay = 10ms
# 複製が少し遅れても、つなぎ直したときに追いつけるだけの WAL を残す
wal_keep_size = 4GB
