; asia2 の PostgreSQL（2 コア）の手前で、全台のアプリの問い合わせを束ねる。
; 17:05 の回で、CPU の実行待ちが平均 33・最大 104 あり、同時に走る問い合わせが多すぎて切り替えと取り合いに CPU を使っていた。
; 欧米の台は往復 100ms の間も接続を握るので、アプリの接続の本数と、DB で同時に走る数を切り離す。
; 設定を変えたら sudo systemctl restart pgbouncer（deploy は pgbouncer を reload・restart しない）

[databases]
isureal = host=127.0.0.1 port=5432 dbname=isureal

[pgbouncer]
listen_addr = 127.0.0.1,192.168.4.10
listen_port = 6432
unix_socket_dir = /var/run/postgresql

; 認証の検証子は起動のたびに PostgreSQL から書き出す（/usr/local/sbin/isu-pgbouncer-userlist）。サーバーへは同じ SCRAM の鍵で入る
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; アプリのトランザクションは 1 本の接続で完結し、LISTEN もセッション単位のロックも使っていない
pool_mode = transaction
default_pool_size = 12
min_pool_size = 12
reserve_pool_size = 4
reserve_pool_timeout = 0.5
max_db_connections = 16
max_client_conn = 1000
; asia1・asia2 のアプリは文を準備して使い回す（pgx の既定）。pgbouncer がサーバー側の接続ごとに準備し直す
max_prepared_statements = 512
ignore_startup_parameters = extra_float_digits

client_tls_sslmode = disable
server_tls_sslmode = disable
tcp_keepalive = 1
log_connections = 0
log_disconnections = 0
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
admin_users = postgres
