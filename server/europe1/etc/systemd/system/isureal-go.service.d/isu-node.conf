# アプリが 4 台になったので、PostgreSQL の max_connections 100 に収めるため本数を減らす（asia1 30・asia2 25・europe1 15・america1 15）。この台の利用者は少ない
[Service]
Environment=ISUREAL_DB_MAX_CONNS=15
# DB（asia2）まで往復 100ms あるので、確かめたセッションを台のメモリに短い間だけ覚える（session_cache.go）
Environment=ISUREAL_SESSION_CACHE=1
# DB（asia2）まで往復 100ms あるので、SQL ごとの文の準備の往復を省き（毎回 1 往復）、接続を閉じずに起動時に開いておく（server.go）
Environment=ISUREAL_DB_EXEC_MODE=exec
Environment=ISUREAL_DB_KEEP_CONNS=1
