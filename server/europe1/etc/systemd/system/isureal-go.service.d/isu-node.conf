# DB まで往復 100ms あるので、接続 1 本が 1 回の問い合わせで 100ms ふさがる。15 本では約 80 件/秒で頭打ちになり、
# 3 日目に入った新しい人が期間内に投稿しきれなかった。60 本では asia2 の DB の取り合いが増えて asia の新しい人が半減し、空きメモリも 38MB まで落ちたので 30 本にする（asia1 30・asia2 25・europe1 30・america1 30）
[Service]
Environment=ISUREAL_DB_MAX_CONNS=30
# DB（asia2）まで往復 100ms あるので、確かめたセッションを台のメモリに短い間だけ覚える（session_cache.go）
Environment=ISUREAL_SESSION_CACHE=1
# DB（asia2）まで往復 100ms あるので、SQL ごとの文の準備の往復を省き（毎回 1 往復）、接続を閉じずに起動時に開いておく（server.go）
Environment=ISUREAL_DB_EXEC_MODE=exec
Environment=ISUREAL_DB_KEEP_CONNS=1
# DB（asia2）まで往復 100ms あるので、閲覧者の状態（友達・ブロックなど）を 1 回のクエリで読む（viewer_one_query.go）
Environment=ISUREAL_VIEWER_ONE_QUERY=1
# この台で登録した人の今日の投稿を台のメモリに持ち、「今の投稿期間」と「自分の今日の投稿」を DB に聞かずに返す（local_post_state.go）
Environment=ISUREAL_LOCAL_POST_STATE=1
