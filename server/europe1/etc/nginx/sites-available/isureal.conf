# europe の利用者は europe1 にしか来ない（ルーターが国で振り分ける）。この台から DB（asia2）までは往復 100ms あり、
# 1 リクエストの時間がほぼ「DB の往復回数 × 100ms」で決まっていた。DB の往復が多い API は、asia のアプリへ 1 往復で転送し、DB の近くで処理させる。
# 転送先は asia1 の nginx と同じく、接続元（X-Client-IP）で台を固定する（isureal-guard は台ごとのジャーナルで失敗を数えるため）
upstream isureal_asia {
  hash $http_x_client_ip consistent;
  # asia1 の nginx と同じく、asia2 のアプリには振らず、asia2 の CPU をすべて DB に回す（3051073）
  server 192.168.1.10:8080 max_fails=3 fail_timeout=5s;
  # 遠い台への接続を張り直すと往復が 1 回増えるので、使い回す
  keepalive 64;
  keepalive_timeout 120s;
  keepalive_requests 100000;
}

upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 32;
}

# この台に残す API と、その理由
# - 通知（SSE）：投稿期間の見張りは、台のリージョンごとに動く
# - 画像の取得と投稿：画像はこの台のディスクに置き、投稿した本人がすぐ確かめる画像を手元から返す
# - 登録・投稿期間・自分の今日の投稿・投稿の削除：この台で登録した人の今日の投稿を、台のメモリに持っている（local_post_state.go）
# - ログイン・ログアウト・退会・自分の変更：この台で覚えたセッションを、その場で忘れさせる（session_cache.go）
# - エクスポート：数 MB の ZIP を遠い経路で運ばない
# - DB に書かない読み取り（フィード・Memories・投稿・コメントと RealMoji の一覧・利用者・自分・関係）：同じ台の複製で読む（replica.go）。
#   asia に転送すると、asia の 2 台の処理能力を 3 リージョンで分け合う。検索は名前の正規化を DB に書くので、転送のまま
map "$request_method $uri" $isureal_upstream {
  default                                isureal_asia;
  "~^GET /api/feeds/"                    isureal_local;
  "GET /api/memories"                    isureal_local;
  "~^GET /api/memories/"                 isureal_local;
  "~^GET /api/posts/[^/]+$"              isureal_local;
  "~^GET /api/posts/[^/]+/(comments|realmojis)$" isureal_local;
  "~^GET /api/users/[^/]+$"              isureal_local;
  "GET /api/me"                          isureal_local;
  "~^GET /api/relationships/"            isureal_local;
  "GET /api/notifications"               isureal_local;
  "~^GET /api/images/"                   isureal_local;
  "POST /api/posts"                      isureal_local;
  "~^DELETE /api/posts/[0-9a-f-]{36}$"   isureal_local;
  "GET /api/posting-window/current"      isureal_local;
  "GET /api/posts/me/current"            isureal_local;
  "POST /api/auth/register"              isureal_local;
  "POST /api/auth/login"                 isureal_local;
  "POST /api/auth/logout"                isureal_local;
  "POST /api/me/account-deletion"        isureal_local;
  "PATCH /api/me"                        isureal_local;
  "GET /api/me/export"                   isureal_local;
  "POST /api/initialize"                 isureal_local;
  "~^[A-Z]+ /api/admin/"                 isureal_local;
}

# 転送するときだけ、この台のリージョンを付ける（region.go）。空の値は送られないので、この台のアプリには外からの値も届かない
map $isureal_upstream $isureal_proxied_region {
  isureal_asia  europe;
  default       "";
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Isureal-Region $isureal_proxied_region;

  # 画像のアップロードを遠い台へ流し込む。asia1 と同じく、一時ファイルに書かない
  proxy_request_buffering off;
  client_body_buffer_size 1m;
  proxy_buffers 64 16k;
  proxy_busy_buffers_size 256k;
  proxy_max_temp_file_size 0;

  location /api/ {
    proxy_pass http://$isureal_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
}
