# make local-up で起動する手元の環境（scripts/local.sh）。data/ は local.sh が用意する
# ISUREAL はアプリが地域ごとに 3 台あるが、セッションの地域とアプリの地域が違うと 403 になるので、手元は asia の 1 台だけ立てる
name: isu-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: isureal
      POSTGRES_PASSWORD: isureal
      POSTGRES_DB: isureal
    volumes:
      - ./data/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 初期データの取り込みの間は、公式のイメージが TCP を閉じた仮のサーバーで動くので、TCP で見る
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "isureal", "-d", "isureal"]
      interval: 2s
      retries: 90
      start_period: 30m
  app:
    build:
      context: ../webapp
      # 取り込んだコードに Dockerfile が無い。初期化が ../sql/init.sh から psql を呼ぶので、psql と sql/ も入れる
      dockerfile_inline: |
        FROM golang:1.26 AS build
        ENV GOTOOLCHAIN=auto
        WORKDIR /src
        COPY go/go.mod go/go.sum ./
        RUN go mod download
        COPY go/ ./
        RUN go build -o /isureal ./cmd/isureal
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends postgresql-client ca-certificates && rm -rf /var/lib/apt/lists/*
        COPY sql/ /webapp/sql/
        COPY --from=build /isureal /webapp/go/isureal
        WORKDIR /webapp/go
        CMD ["./isureal"]
    environment:
      ISUREAL_REGION: asia
      ISUREAL_DB_HOST: postgres
      ISUREAL_DB_USER: isureal
      ISUREAL_DB_PASSWORD: isureal
      ISUREAL_DB_NAME: isureal
    depends_on:
      postgres:
        condition: service_healthy
  nginx:
    image: nginx:1.27.3
    ports:
      - "${LOCAL_PORT:-8080}:80"
    volumes:
      - ./data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/public:/public:ro
    depends_on:
      - app
